<!-- src/app/components/login/login.component.html -->

<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold">Agent Host</h1>
    </div>

    <div class="bg-gray-800 border border-gray-700 rounded-lg p-6">
      <!-- Mode tabs -->
      <div class="flex mb-6 border border-gray-700 rounded-lg overflow-hidden text-sm">
        <button
          type="button"
          class="flex-1 py-2 transition"
          [class.bg-blue-600]="mode() === 'login'"
          [class.text-gray-300]="mode() !== 'login'"
          (click)="switchMode('login')"
        >
          {{ 'login.signIn' | translate }}
        </button>
        <button
          type="button"
          class="flex-1 py-2 transition"
          [class.bg-blue-600]="mode() === 'register'"
          [class.text-gray-300]="mode() !== 'register'"
          (click)="switchMode('register')"
        >
          {{ 'login.createOrg' | translate }}
        </button>
      </div>

      @if (errorKey()) {
        <div class="bg-red-900/50 border border-red-700 rounded-lg p-3 mb-4 text-sm text-red-200">
          {{ errorKey() | translate }}
        </div>
      }

      @if (mode() === 'login') {
        <form [formGroup]="loginForm" (ngSubmit)="submitLogin()" class="space-y-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1" for="login-email">
              {{ 'login.email' | translate }}
            </label>
            <input
              id="login-email"
              type="email"
              formControlName="email"
              autocomplete="email"
              class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded text-sm"
            />
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1" for="login-password">
              {{ 'login.password' | translate }}
            </label>
            <input
              id="login-password"
              type="password"
              formControlName="password"
              autocomplete="current-password"
              class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded text-sm"
            />
          </div>
          <button
            type="submit"
            [disabled]="isSubmitting()"
            class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 rounded font-medium transition"
          >
            {{ (isSubmitting() ? 'login.signingIn' : 'login.signIn') | translate }}
          </button>
        </form>
      } @else {
        <form [formGroup]="registerForm" (ngSubmit)="submitRegister()" class="space-y-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1" for="reg-org-name">
              {{ 'login.orgName' | translate }}
            </label>
            <input
              id="reg-org-name"
              type="text"
              formControlName="orgName"
              (input)="onOrgNameInput($any($event.target).value)"
              class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded text-sm"
            />
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1" for="reg-org-slug">
              {{ 'login.orgSlug' | translate }}
            </label>
            <input
              id="reg-org-slug"
              type="text"
              formControlName="orgSlug"
              (input)="onOrgSlugInput()"
              class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded text-sm font-mono"
            />
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1" for="reg-display-name">
              {{ 'login.displayName' | translate }}
            </label>
            <input
              id="reg-display-name"
              type="text"
              formControlName="displayName"
              class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded text-sm"
            />
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1" for="reg-email">
              {{ 'login.email' | translate }}
            </label>
            <input
              id="reg-email"
              type="email"
              formControlName="email"
              autocomplete="email"
              class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded text-sm"
            />
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1" for="reg-password">
              {{ 'login.password' | translate }}
            </label>
            <input
              id="reg-password"
              type="password"
              formControlName="password"
              autocomplete="new-password"
              class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded text-sm"
            />
            <p class="text-xs text-gray-500 mt-1">{{ 'login.passwordHint' | translate }}</p>
          </div>
          <button
            type="submit"
            [disabled]="isSubmitting()"
            class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 rounded font-medium transition"
          >
            {{ (isSubmitting() ? 'login.creating' : 'login.createOrg') | translate }}
          </button>
        </form>
      }
    </div>
  </div>
</div>
