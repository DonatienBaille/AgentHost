{{- /*
The database password has no chart default on purpose: "changeme" shipped in values.yaml is a
default credential in every install that forgets to override it. It is only required when this
chart actually builds the connection string from it — a deployment bringing its own
secrets.connectionString (external database, postgres.enabled=false) never needs it.
*/ -}}
{{- $connectionString := .Values.secrets.connectionString -}}
{{- if not $connectionString -}}
  {{- $password := required "postgres.auth.password is required (or set secrets.connectionString to point at an existing database)" .Values.postgres.auth.password -}}
  {{- $connectionString = printf "Host=%s-postgres;Database=%s;Username=%s;Password=%s" (include "agenthost.fullname" .) .Values.postgres.auth.database .Values.postgres.auth.username $password -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agenthost.fullname" . }}-secrets
type: Opaque
stringData:
  connectionString: {{ $connectionString | quote }}
  encryptionKey: {{ required "secrets.encryptionKey is required (base64 AES-256 key for secret encryption)" .Values.secrets.encryptionKey | quote }}
  jwtSecret: {{ required "secrets.jwtSecret is required (>=32 bytes, used to sign JWTs)" .Values.secrets.jwtSecret | quote }}
