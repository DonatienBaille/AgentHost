apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenthost.fullname" . }}-backend
  labels:
    {{- include "agenthost.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agenthost.labels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "agenthost.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.backend.port }}
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.service.backend.port }}"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: connectionString
            - name: Secrets__EncryptionKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: encryptionKey
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: jwtSecret
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
