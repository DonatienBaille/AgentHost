{{- $artifactProvider := .Values.artifacts.provider | default "local" -}}
{{- $localArtifacts := eq $artifactProvider "local" -}}
{{- if not (has $artifactProvider (list "local" "s3")) -}}
  {{- fail (printf "artifacts.provider must be 'local' or 's3', got %q" $artifactProvider) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenthost.fullname" . }}-backend
  labels:
    {{- include "agenthost.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  # The orchestrator is node-bound and its data lives on a ReadWriteOnce volume, so a rolling
  # update must terminate the old pod before starting the new one — otherwise the new pod cannot
  # attach the volume and the rollout stalls.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agenthost.labels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "agenthost.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        # Matches the uid/gid baked into Dockerfile.backend.
        runAsNonRoot: true
        runAsUser: 64198
        runAsGroup: 64198
        fsGroup: 64198
        {{- if and .Values.docker.mountSocket (gt (int .Values.docker.socketGroupId) 0) }}
        # Lets the non-root user reach the node's Docker socket without running as root.
        supplementalGroups:
          - {{ .Values.docker.socketGroupId }}
        {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.backend }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.backend.port }}
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.service.backend.port }}"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: connectionString
            - name: Secrets__EncryptionKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: encryptionKey
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: jwtSecret
            {{- if .Values.redis.enabled }}
            # Also switches on the SignalR Redis backplane (Program.cs enables it whenever Redis is
            # reachable), without which hub events never reach clients on another replica.
            - name: Redis__Host
              value: {{ include "agenthost.fullname" . }}-redis
            - name: Redis__Port
              value: "6379"
            {{- end }}
            - name: Docker__Host
              value: {{ .Values.docker.host | default (printf "unix://%s" .Values.docker.socketPath) | quote }}
            - name: Docker__WorkspacePath
              value: /var/agenthost/runs
            {{- with .Values.docker.hostWorkspacePath }}
            # The node's own path for the same directory: bind sources are resolved by the daemon,
            # not by this pod. See the values.yaml comment before setting it.
            - name: Docker__HostWorkspacePath
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.docker.bindMountOptions }}
            - name: Docker__BindMountOptions
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.docker.egressProxy }}
            - name: Docker__EgressProxy
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.docker.allowlistNetwork }}
            - name: Docker__AllowlistNetwork
              value: {{ . | quote }}
            {{- end }}
            - name: Artifacts__Provider
              value: {{ $artifactProvider | quote }}
            {{- if $localArtifacts }}
            - name: Artifacts__StoragePath
              value: /var/agenthost/artifacts
            {{- else }}
            - name: Artifacts__S3__Bucket
              value: {{ required "artifacts.s3.bucket is required when artifacts.provider is 's3'" .Values.artifacts.s3.bucket | quote }}
            {{- with .Values.artifacts.s3.serviceUrl }}
            - name: Artifacts__S3__ServiceUrl
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.artifacts.s3.region }}
            - name: Artifacts__S3__Region
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.artifacts.s3.forcePathStyle }}
            - name: Artifacts__S3__ForcePathStyle
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.artifacts.s3.keyPrefix }}
            - name: Artifacts__S3__KeyPrefix
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.artifacts.s3.accessKey }}
            # Static credentials. On AWS prefer IRSA/workload identity and leave these empty, so no
            # long-lived key exists to leak in the first place.
            - name: Artifacts__S3__AccessKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: s3AccessKey
            - name: Artifacts__S3__SecretKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: s3SecretKey
            {{- end }}
            {{- end }}
            - name: Retention__WorkspaceHours
              value: {{ .Values.retention.workspaceHours | quote }}
            - name: Retention__SecretsGraceMinutes
              value: {{ .Values.retention.secretsGraceMinutes | quote }}
            - name: Retention__ArtifactDays
              value: {{ .Values.retention.artifactDays | quote }}
            {{- range $i, $network := .Values.forwardedHeaders.knownNetworks }}
            - name: ForwardedHeaders__KnownNetworks__{{ $i }}
              value: {{ $network | quote }}
            {{- end }}
            {{- range $i, $proxy := .Values.forwardedHeaders.knownProxies }}
            - name: ForwardedHeaders__KnownProxies__{{ $i }}
              value: {{ $proxy | quote }}
            {{- end }}
            {{- with .Values.otlpEndpoint }}
            - name: OpenTelemetry__OtlpEndpoint
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ingress.enabled }}
            - name: Cors__AllowedOrigins__0
              value: "http{{ if .Values.ingress.tls }}s{{ end }}://{{ .Values.ingress.host }}"
            {{- end }}
          volumeMounts:
            - name: runs
              mountPath: /var/agenthost/runs
            {{- if $localArtifacts }}
            - name: artifacts
              mountPath: /var/agenthost/artifacts
            {{- end }}
            {{- if .Values.docker.mountSocket }}
            - name: docker-socket
              mountPath: {{ .Values.docker.socketPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          # Readiness gates traffic on Postgres being reachable; liveness deliberately does not, so
          # a database blip cannot make the kubelet restart every otherwise-healthy pod.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        # Run workspaces and artifacts must outlive the pod: artifacts are served back to users long
        # after the run that produced them has exited.
        - name: runs
          {{- if .Values.persistence.runs.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "agenthost.fullname" . }}-runs
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $localArtifacts }}
        - name: artifacts
          {{- if .Values.persistence.artifacts.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "agenthost.fullname" . }}-artifacts
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.docker.mountSocket }}
        # The orchestrator launches agents on the node's Docker daemon; with no socket here and no
        # proxy in docker.host, the backend cannot start a single run.
        - name: docker-socket
          hostPath:
            path: {{ .Values.docker.socketPath }}
            type: Socket
        {{- end }}
