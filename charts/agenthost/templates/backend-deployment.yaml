{{- $artifactProvider := .Values.artifacts.provider | default "local" -}}
{{- $runner := .Values.runner.enabled -}}
{{- /*
Garde-fou : sans le tier runner, plusieurs répliques backend ne se partagent pas la capacité, elles
cassent le contrôle des runs — chacune ne voit que les conteneurs de son propre nœud et répond
« annulé » sans rien avoir arrêté. Échouer au rendu du chart plutôt que de laisser découvrir la
panne en production, où elle se manifeste par des runs qu'on ne peut plus arrêter.
*/ -}}
{{- if and (gt (int .Values.replicaCount) 1) (not $runner) -}}
  {{- fail "replicaCount > 1 requires runner.enabled: true. Without the runner tier the backend talks to its own node's container daemon, so a second replica cannot stop or read the logs of a run the first one launched." -}}
{{- end -}}
{{- $localArtifacts := eq $artifactProvider "local" -}}
{{- if not (has $artifactProvider (list "local" "s3")) -}}
  {{- fail (printf "artifacts.provider must be 'local' or 's3', got %q" $artifactProvider) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenthost.fullname" . }}-backend
  labels:
    {{- include "agenthost.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if $runner }}
  # Mise à jour sans coupure : avec le tier runner, une réplique backend ne détient plus rien de
  # nœud-local. Elle ne monte plus le socket, et les données de run vivent sur les nœuds runner (ou
  # dans un bucket pour les artefacts), donc plus rien n'oblige à arrêter l'ancien pod avant de
  # démarrer le nouveau — ce qui était la vraie cause de la coupure à chaque déploiement.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  # Sans tier runner, l'orchestrateur est lié au nœud et ses données vivent sur un volume
  # ReadWriteOnce : une mise à jour progressive doit terminer l'ancien pod avant de démarrer le
  # nouveau, sinon celui-ci ne peut pas attacher le volume et le déploiement se bloque.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "agenthost.labels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "agenthost.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        # Matches the uid/gid baked into Dockerfile.backend.
        runAsNonRoot: true
        runAsUser: 64198
        runAsGroup: 64198
        fsGroup: 64198
        {{- if and (not $runner) .Values.docker.mountSocket (gt (int .Values.docker.socketGroupId) 0) }}
        # Lets the non-root user reach the node's Docker socket without running as root.
        # Inutile dès que le tier runner existe : le backend ne touche plus au socket.
        supplementalGroups:
          - {{ .Values.docker.socketGroupId }}
        {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.backend }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.backend.port }}
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.service.backend.port }}"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: connectionString
            - name: Secrets__EncryptionKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: encryptionKey
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: jwtSecret
            {{- if .Values.redis.enabled }}
            # Also switches on the SignalR Redis backplane (Program.cs enables it whenever Redis is
            # reachable), without which hub events never reach clients on another replica.
            - name: Redis__Host
              value: {{ include "agenthost.fullname" . }}-redis
            - name: Redis__Port
              value: "6379"
            {{- end }}
            {{- if $runner }}
            # Orchestration déléguée au DaemonSet runner. Le backend ne parle plus à aucun démon :
            # c'est ce qui le rend réplicable, et c'est aussi ce qui lui retire l'accès root au nœud.
            - name: Runner__Mode
              value: "remote"
            - name: Runner__BaseUrl
              value: "http://{{ include "agenthost.fullname" . }}-runner:{{ .Values.runner.port }}"
            - name: Runner__AuthToken
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: runnerAuthToken
            {{- else }}
            - name: Docker__Host
              value: {{ .Values.docker.host | default (printf "unix://%s" .Values.docker.socketPath) | quote }}
            - name: Docker__WorkspacePath
              value: /var/agenthost/runs
            {{- end }}
            {{- if not $runner }}
            {{- with .Values.docker.hostWorkspacePath }}
            # The node's own path for the same directory: bind sources are resolved by the daemon,
            # not by this pod. See the values.yaml comment before setting it.
            - name: Docker__HostWorkspacePath
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.docker.bindMountOptions }}
            - name: Docker__BindMountOptions
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.docker.egressProxy }}
            - name: Docker__EgressProxy
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.docker.allowlistNetwork }}
            - name: Docker__AllowlistNetwork
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: Artifacts__Provider
              value: {{ $artifactProvider | quote }}
            {{- if $localArtifacts }}
            - name: Artifacts__StoragePath
              value: /var/agenthost/artifacts
            {{- else }}
            - name: Artifacts__S3__Bucket
              value: {{ required "artifacts.s3.bucket is required when artifacts.provider is 's3'" .Values.artifacts.s3.bucket | quote }}
            {{- with .Values.artifacts.s3.serviceUrl }}
            - name: Artifacts__S3__ServiceUrl
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.artifacts.s3.region }}
            - name: Artifacts__S3__Region
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.artifacts.s3.forcePathStyle }}
            - name: Artifacts__S3__ForcePathStyle
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.artifacts.s3.keyPrefix }}
            - name: Artifacts__S3__KeyPrefix
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.artifacts.s3.accessKey }}
            # Static credentials. On AWS prefer IRSA/workload identity and leave these empty, so no
            # long-lived key exists to leak in the first place.
            - name: Artifacts__S3__AccessKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: s3AccessKey
            - name: Artifacts__S3__SecretKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenthost.fullname" . }}-secrets
                  key: s3SecretKey
            {{- end }}
            {{- end }}
            - name: Retention__WorkspaceHours
              value: {{ .Values.retention.workspaceHours | quote }}
            - name: Retention__SecretsGraceMinutes
              value: {{ .Values.retention.secretsGraceMinutes | quote }}
            - name: Retention__ArtifactDays
              value: {{ .Values.retention.artifactDays | quote }}
            {{- range $i, $network := .Values.forwardedHeaders.knownNetworks }}
            - name: ForwardedHeaders__KnownNetworks__{{ $i }}
              value: {{ $network | quote }}
            {{- end }}
            {{- range $i, $proxy := .Values.forwardedHeaders.knownProxies }}
            - name: ForwardedHeaders__KnownProxies__{{ $i }}
              value: {{ $proxy | quote }}
            {{- end }}
            {{- with .Values.otlpEndpoint }}
            - name: OpenTelemetry__OtlpEndpoint
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ingress.enabled }}
            - name: Cors__AllowedOrigins__0
              value: "http{{ if .Values.ingress.tls }}s{{ end }}://{{ .Values.ingress.host }}"
            {{- end }}
          volumeMounts:
            {{- if not $runner }}
            - name: runs
              mountPath: /var/agenthost/runs
            {{- end }}
            {{- if $localArtifacts }}
            - name: artifacts
              mountPath: /var/agenthost/artifacts
            {{- end }}
            {{- if and (not $runner) .Values.docker.mountSocket }}
            - name: docker-socket
              mountPath: {{ .Values.docker.socketPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          # Readiness gates traffic on Postgres being reachable; liveness deliberately does not, so
          # a database blip cannot make the kubelet restart every otherwise-healthy pod.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        {{- if not $runner }}
        # Workspaces des runs : n'existent dans le pod backend que sans tier runner. Avec le tier
        # runner ils vivent sur les nœuds, et ce volume — ainsi que son PVC ReadWriteOnce, qui est
        # ce qui empêchait une seconde réplique de se planifier — disparaît du pod backend.
        - name: runs
          {{- if .Values.persistence.runs.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "agenthost.fullname" . }}-runs
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if $localArtifacts }}
        - name: artifacts
          {{- if .Values.persistence.artifacts.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "agenthost.fullname" . }}-artifacts
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if and (not $runner) .Values.docker.mountSocket }}
        # Sans tier runner, l'orchestrateur lance les agents sur le démon du nœud ; sans ce socket et
        # sans proxy dans docker.host, le backend ne peut démarrer aucun run. Avec le tier runner,
        # ce montage disparaît : le socket n'est plus détenu que par le DaemonSet.
        - name: docker-socket
          hostPath:
            path: {{ .Values.docker.socketPath }}
            type: Socket
        {{- end }}
