apiVersion: v1
kind: Service
metadata:
  name: {{ include "agenthost.fullname" . }}-backend
  labels:
    {{- include "agenthost.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "agenthost.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - port: {{ .Values.service.backend.port }}
      targetPort: {{ .Values.service.backend.port }}
