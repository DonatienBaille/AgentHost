{{- /*
Désactivé par défaut (values.yaml), mais plus bloqué : depuis le lot 1.1, runner.enabled: true sort
l'orchestration dans un DaemonSet et fait persister au backend quel runner détient chaque run, si
bien que les répliques backend sont réellement interchangeables.

Sans le tier runner, en revanche, l'autoscaling ajoute des répliques qui ne peuvent silencieusement
pas faire le travail : chacune ne voit que les conteneurs de son propre nœud. Le rendu échoue donc
plutôt que de laisser un HPA fabriquer cette panne tout seul, à l'heure de pointe.
*/ -}}
{{- if .Values.autoscaling.backend.enabled }}
{{- if not .Values.runner.enabled }}
  {{- fail "autoscaling.backend.enabled requires runner.enabled: true — without the runner tier, extra backend replicas cannot manage runs started by another replica." }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agenthost.fullname" . }}-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agenthost.fullname" . }}-backend
  minReplicas: {{ .Values.autoscaling.backend.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.backend.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.backend.targetCPUUtilizationPercentage }}
{{- end }}
