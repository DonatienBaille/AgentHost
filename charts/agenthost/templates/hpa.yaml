{{- /*
Disabled by default (values.yaml). The backend is not horizontally scalable today: the orchestrator
talks to the Docker daemon of its own node and run data lives on a ReadWriteOnce volume, so extra
replicas cannot manage or observe runs started by the first one. This template is kept ready for the
day the orchestrator moves into its own runner tier; enabling it before then adds replicas that
silently cannot do the job.
*/ -}}
{{- if .Values.autoscaling.backend.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agenthost.fullname" . }}-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agenthost.fullname" . }}-backend
  minReplicas: {{ .Values.autoscaling.backend.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.backend.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.backend.targetCPUUtilizationPercentage }}
{{- end }}
