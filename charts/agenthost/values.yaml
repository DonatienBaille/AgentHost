# Nombre de répliques des déploiements backend ET frontend.
#
# LE BACKEND EST DÉSORMAIS RÉPLICABLE, à une condition : runner.enabled (ci-dessous), qui sort
# l'orchestration dans un DaemonSet et fait persister au backend quel runner détient chaque run
# (colonne runs.runner_url, migration 0009). N'importe quelle réplique peut alors arrêter et lire
# un run qu'elle n'a pas lancé.
#
# Les autres prérequis sont en place et doivent le rester : le backplane Redis SignalR (activé dès
# que Redis est joignable — sans lui un client connecté à la réplique A ne voit pas les événements
# publiés par la B) et le stockage objet S3 pour les artefacts (artifacts.provider: s3 — sinon
# chaque réplique ne sert que les artefacts qu'elle a écrits sur son propre volume).
#
# AVEC runner.enabled: false, GARDEZ 1. Le backend parle alors au démon de son propre nœud et une
# seconde réplique ne trouverait pas les conteneurs de la première : elle répondrait « annulé »
# sans rien avoir arrêté.
#
# Défaut à 1 délibérément : la mise à l'échelle est un choix d'exploitation, pas un effet de bord
# d'une mise à jour de chart.
replicaCount: 1

image:
  backend: agenthost/backend:latest
  frontend: agenthost/frontend:latest
  runner: agenthost/runner:latest
  pullPolicy: IfNotPresent

service:
  backend:
    port: 5000
  frontend:
    port: 80
    # The frontend image runs nginx unprivileged, so inside the container it listens on 8080.
    containerPort: 8080

# Tier d'exécution (lot 1.1) : un DaemonSet qui expose l'orchestration de conteneurs du nœud sur
# HTTP, et que le backend pilote au lieu de parler lui-même au démon.
#
# C'EST CE QUI DÉBLOQUE replicaCount > 1. Sans lui, « où tourne le conteneur de ce run » n'est
# écrit nulle part : c'est une propriété implicite du pod qui a reçu la requête de création.
#
# enabled: false garde le comportement historique (backend en mode inprocess, une seule réplique).
runner:
  enabled: false
  port: 5001
  # Jeton porteur partagé backend <-> runner. Sans lui le runner refuse de démarrer : un runner
  # ouvert est un accès root sur le nœud. `openssl rand -base64 32`. Écrit dans le Secret du chart.
  # (Le réseau reste la défense principale : la NetworkPolicy n'y laisse entrer que le backend.)
  authToken: ""
  # Monter le socket du nœud dans le pod runner. C'est le seul pod qui en a besoin ; le backend
  # cesse de l'avoir dès que runner.enabled est vrai.
  mountSocket: true
  # Répertoire des données de run, sur le nœud.
  workspacePath: /var/agenthost/runs
  # true : volume hostPath au même chemin absolu. C'est le montage cohérent ici — les données de
  # run sont locales au nœud qui exécute le conteneur, et le démon doit voir ce répertoire sous ce
  # chemin exact. C'est aussi ce qui fait DISPARAÎTRE la tension entre docker.hostWorkspacePath et
  # un PVC réseau : le workspace redevient local au processus qui parle au démon.
  # false : emptyDir, correct seulement pour un essai — les données de run meurent avec le pod.
  hostPathWorkspace: true
  nodeSelector: {}
  tolerations: []

# Container runtime access for the orchestrator.
#
# Docker and Podman both serve the Docker REST API and the orchestrator makes identical calls
# against either, so there is no runtime switch — only the socket path differs. For Podman:
#   socketPath: /run/podman/podman.sock     (rootful service; see values-podman.yaml)
#   socketPath: /run/user/<uid>/podman/podman.sock   (rootless — read the Podman section of README)
docker:
  # Mount the node's runtime socket into the BACKEND pod. N'a de sens qu'avec runner.enabled: false :
  # dès que le tier runner existe, c'est lui qui détient le socket et le backend n'en a plus besoin
  # (le template le retire alors du pod backend, quelle que soit la valeur ici).
  #
  # SECURITY: whoever holds this socket is root on the node. Prefer deploying a filtering socket
  # proxy (as docker-compose.yml does with tecnativa/docker-socket-proxy — it fronts a Podman socket
  # just as well), pointing `host` at it, and leaving mountSocket off.
  mountSocket: true
  socketPath: /var/run/docker.sock
  # Path at which the NODE (i.e. the daemon) sees the same directory the backend has mounted at
  # /var/agenthost/runs. Bind sources are resolved by the daemon, not by the backend pod, so with a
  # PVC that the daemon cannot see under that name, agents start with an empty /workspace and an
  # empty /run/secrets and nothing reports an error.
  #
  # Leave empty ONLY when the runs volume is a hostPath that the node exposes at the same absolute
  # path (the simple, and honestly the only fully coherent, node-bound setup). With a networked PVC
  # there is generally no such path and agent bind mounts cannot work at all — that is a property of
  # handing a node's daemon a path from another filesystem, not something this chart can paper over.
  hostWorkspacePath: ""
  # Extra options appended to every agent bind mount, comma-separated. SELinux nodes: "z".
  # Rootless Podman: "U" (chown the mounted tree into the container's user namespace).
  bindMountOptions: ""
  # Docker__Host. Empty means unix://{socketPath}; set to e.g. tcp://docker-socket-proxy:2375 to go
  # through a filtering proxy.
  host: ""
  # GID owning the socket on the node, added as a supplemental group so the non-root backend user
  # can use it (`stat -c %g /var/run/docker.sock` on a node). 0 = don't add one, in which case the
  # pod must run as root to reach the socket — which defeats the non-root container.
  socketGroupId: 0
  # HTTP(S) proxy for agents whose manifest asks for permissions.network=allowlist. Unset means
  # those runs get NO network at all (fail closed) rather than unfiltered egress.
  egressProxy: ""
  # Optional Docker network for allowlist runs. Use an internal network on which only the egress
  # proxy is reachable — otherwise HTTP_PROXY is advisory and a raw socket bypasses it.
  allowlistNetwork: ""

# Where run artifacts are stored.
#
#   local  (default) — files under /var/agenthost/artifacts in the backend pod, i.e. on the
#                      persistence.artifacts volume below.
#   s3              — any S3-compatible object store: AWS S3, MinIO, Ceph RGW. The
#                     persistence.artifacts PVC then serves no purpose and should be disabled;
#                     nothing writes to it.
#
# S3 artifacts are the PREREQUISITE for serving artifacts from more than one replica, not the thing
# that delivers it: with objects in a bucket, any replica can serve any artifact. Avec
# runner.enabled et replicaCount > 1, le passage à 's3' n'est plus une bonne pratique mais une
# obligation : sur disque local, chaque réplique ne sert que les artefacts qu'elle a écrits.
artifacts:
  provider: local
  s3:
    bucket: ""
    # Custom endpoint for MinIO/Ceph, e.g. http://minio.minio.svc:9000. Empty = real AWS S3.
    serviceUrl: ""
    region: ""
    # Leave both empty to use the ambient credential chain (IRSA / workload identity / node role),
    # which is the right answer on AWS. When set, they are written into the chart's Secret.
    accessKey: ""
    secretKey: ""
    # Defaults to true whenever serviceUrl is set (MinIO/Ceph have no per-bucket DNS).
    forcePathStyle: ""
    keyPrefix: artifacts

# Run workspaces and artifacts are files on disk: the orchestrator writes them, and the API reads
# them back when an artifact is downloaded. With no volume they live in the pod's ephemeral
# filesystem, so artifacts vanish on every restart.
#
# accessMode ReadWriteOnce matches replicaCount 1. Avec plusieurs répliques backend il faut du
# ReadWriteMany, ou — bien mieux — runner.enabled: true (les workspaces vivent alors sur les nœuds
# runner) et artifacts.provider: s3 : la volumétrie du pod backend devient inutile et les deux PVC
# peuvent être désactivés.
persistence:
  runs:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  artifacts:
    # Set to false when artifacts.provider is "s3": the volume is then never written to, and the
    # chart stops mounting it. Kept enabled by default because the default provider is "local".
    enabled: true
    size: 20Gi
    accessMode: ReadWriteOnce
    storageClass: ""

# On-disk retention applied by the backend's janitor (0 disables a sweep).
retention:
  workspaceHours: 168
  secretsGraceMinutes: 60
  artifactDays: 0

# Reverse proxies whose X-Forwarded-For/-Proto the API may trust. The ingress controller's pod CIDR
# belongs here; without it every anonymous caller shares a single rate-limit bucket.
forwardedHeaders:
  knownNetworks: []
  knownProxies: []

# OTLP endpoint for trace export, e.g. http://otel-collector:4317. Empty = collected, never exported.
otlpEndpoint: ""

postgres:
  enabled: true
  auth:
    username: agenthost
    # No default on purpose: a password baked into the chart is a default credential in every
    # deployment that forgets to override it. Required, like jwtSecret and encryptionKey.
    password: ""
    database: agenthost
  persistence:
    size: 10Gi

redis:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: agenthost.example.com
  tls: true

resources:
  runner:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      # Le runner ne fait que piloter le démon : il ne porte ni la charge des agents (ce sont des
      # conteneurs frères, comptabilisés sur le nœud) ni celle de l'API métier.
      cpu: 500m
      memory: 512Mi
  backend:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Désactivé par défaut, mais plus bloqué : avec runner.enabled: true les répliques backend sont
# réellement interchangeables et l'autoscaling devient défendable. Le laisser à false tant que
# runner.enabled est false — sans le tier runner, ajouter des répliques casse silencieusement le
# contrôle des runs au lieu d'ajouter de la capacité (le template le refuse d'ailleurs).
autoscaling:
  backend:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  backend:
    minAvailable: 1
  runner:
    # maxUnavailable et non minAvailable : sur un DaemonSet le nombre de pods est le nombre de
    # nœuds, que le chart ne connaît pas. Un nœud vidé à la fois.
    enabled: true
    maxUnavailable: 1

networkPolicy:
  enabled: true

secrets:
  # Populate via --set or an external Secret; never commit real values.
  connectionString: ""
  encryptionKey: ""
  jwtSecret: ""
