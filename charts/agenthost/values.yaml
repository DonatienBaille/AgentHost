# Number of replicas for the backend AND frontend deployments.
#
# KEEP THIS AT 1 for the backend as the code stands today. The backend embeds the container
# orchestrator, which talks to the Docker daemon of the node it runs on: StopAsync/GetLogsAsync look
# a run's container up on *that* daemon, so a second replica cannot manage, stop, or read logs from
# runs launched by the first. Run workspaces and artifacts have the same problem — they are
# node-local files (see persistence below).
#
# Horizontal scaling requires decoupling the orchestrator into a separate runner tier (a DaemonSet
# or an external job runner) that the API talks to over an API, so any API replica can act on any
# run. Until that exists, scaling out silently breaks run control instead of adding capacity. The
# SignalR Redis backplane (enabled automatically when Redis is configured) is in place and is a
# prerequisite for that work, but it is not sufficient on its own.
replicaCount: 1

image:
  backend: agenthost/backend:latest
  frontend: agenthost/frontend:latest
  pullPolicy: IfNotPresent

service:
  backend:
    port: 5000
  frontend:
    port: 80
    # The frontend image runs nginx unprivileged, so inside the container it listens on 8080.
    containerPort: 8080

# Docker daemon access for the orchestrator.
docker:
  # Mount the node's Docker socket into the backend pod. Without it — and without `host` pointing
  # somewhere else — the backend cannot launch a single agent, because it has no daemon to talk to.
  #
  # SECURITY: whoever holds this socket is root on the node. Prefer deploying a filtering socket
  # proxy (as docker-compose.yml does with tecnativa/docker-socket-proxy), pointing `host` at it,
  # and leaving mountSocket off.
  mountSocket: true
  socketPath: /var/run/docker.sock
  # Docker__Host. Empty means unix://{socketPath}; set to e.g. tcp://docker-socket-proxy:2375 to go
  # through a filtering proxy.
  host: ""
  # GID owning the socket on the node, added as a supplemental group so the non-root backend user
  # can use it (`stat -c %g /var/run/docker.sock` on a node). 0 = don't add one, in which case the
  # pod must run as root to reach the socket — which defeats the non-root container.
  socketGroupId: 0
  # HTTP(S) proxy for agents whose manifest asks for permissions.network=allowlist. Unset means
  # those runs get NO network at all (fail closed) rather than unfiltered egress.
  egressProxy: ""
  # Optional Docker network for allowlist runs. Use an internal network on which only the egress
  # proxy is reachable — otherwise HTTP_PROXY is advisory and a raw socket bypasses it.
  allowlistNetwork: ""

# Run workspaces and artifacts are files on disk: the orchestrator writes them, and the API reads
# them back when an artifact is downloaded. With no volume they live in the pod's ephemeral
# filesystem, so artifacts vanish on every restart.
#
# accessMode ReadWriteOnce matches replicaCount 1. More than one backend replica would need
# ReadWriteMany (and the runner-tier work described above); with RWO the second pod simply will not
# schedule on another node.
persistence:
  runs:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  artifacts:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteOnce
    storageClass: ""

# On-disk retention applied by the backend's janitor (0 disables a sweep).
retention:
  workspaceHours: 168
  secretsGraceMinutes: 60
  artifactDays: 0

# Reverse proxies whose X-Forwarded-For/-Proto the API may trust. The ingress controller's pod CIDR
# belongs here; without it every anonymous caller shares a single rate-limit bucket.
forwardedHeaders:
  knownNetworks: []
  knownProxies: []

# OTLP endpoint for trace export, e.g. http://otel-collector:4317. Empty = collected, never exported.
otlpEndpoint: ""

postgres:
  enabled: true
  auth:
    username: agenthost
    # No default on purpose: a password baked into the chart is a default credential in every
    # deployment that forgets to override it. Required, like jwtSecret and encryptionKey.
    password: ""
    database: agenthost
  persistence:
    size: 10Gi

redis:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: agenthost.example.com
  tls: true

resources:
  backend:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Disabled on purpose — see the replicaCount comment. The template is kept so this can be switched
# on the day the orchestrator runs in its own tier and the API replicas are genuinely stateless.
autoscaling:
  backend:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  backend:
    minAvailable: 1

networkPolicy:
  enabled: true

secrets:
  # Populate via --set or an external Secret; never commit real values.
  connectionString: ""
  encryptionKey: ""
  jwtSecret: ""
