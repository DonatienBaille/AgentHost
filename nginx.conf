# Runs as the unprivileged `nginx` user (see Dockerfile.frontend), so there is no `user` directive
# — it only takes effect when the master process is root — the listen port is 8080 rather than 80,
# and every path nginx needs to write to lives under /tmp.
worker_processes  auto;
pid /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Writable-by-nginx temp paths (the image's defaults live under /var/cache/nginx).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Don't advertise the nginx version in responses or error pages.
    server_tokens off;

    server {
        listen       8080;
        server_name  localhost;
        root   /usr/share/nginx/html;
        index  index.html;

        # ---- Security headers (always, so they cover error responses too) ----
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;          # legacy equivalent of frame-ancestors
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # CSP for the Angular SPA. The two relaxations are both required by Angular's runtime:
        #   * style-src 'unsafe-inline' — Angular injects component styles as inline <style> blocks.
        #   * connect-src ws:/wss: — SignalR opens a WebSocket back to this origin via /hubs/.
        # script-src stays strict: the production build emits external bundles only, so no
        # 'unsafe-inline'/'unsafe-eval' is needed. Verified against the built bundle — dist/.../
        # index.html references its scripts with <script src=...> and carries no inline JS.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # HSTS belongs wherever TLS actually terminates. Harmless (and ignored by browsers) over
        # plain HTTP, so it stays on for the deployments that do terminate TLS here or upstream.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # The backend's Prometheus scrape endpoint exposes internal operational detail and is
        # deliberately not reachable through the public entry point; scrape the backend directly.
        location = /metrics {
            return 404;
        }

        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Required by the API's UseForwardedHeaders: without these the backend sees this proxy
            # as the client for every request, so all anonymous callers share one rate-limit bucket.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /hubs/ {
            proxy_pass http://backend:5000/hubs/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
