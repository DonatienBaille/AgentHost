name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenthost
          POSTGRES_PASSWORD: agenthost_dev
          POSTGRES_DB: agenthost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=agenthost;Username=agenthost;Password=agenthost_dev"
      Secrets__EncryptionKey: "5ijlcr2IxwxqH7PEwsUIGQSvbZ/w6EMuOk3mXorL54c="
      Jwt__Secret: "hkA6jtNJGUsnP4++43POCQPqDtH2ABIaIUKj9gXxeJmXnpv5kYxiR9tRYT+JUzke"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      # ContainerLifecycleTests launches a real container against the runner's own Docker daemon
      # (ubuntu-latest has one; no service container is involved). It SKIPS itself where no daemon
      # answers, so this step exists to make the loss of that coverage loud: if a future runner
      # image drops Docker, the job fails here instead of quietly going green with the product's
      # core path untested. Pre-pulling the two base images keeps the test off the registry's
      # critical path — alpine is the end-to-end agent's base, busybox is what the manifest in
      # tests/Integration/TestData.cs names.
      - name: Verify the container runtime and pre-pull agent base images
        run: |
          docker version
          docker pull alpine:3.20
          docker pull busybox:latest

      - name: Test
        working-directory: backend
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=ci.trx"

      # A skipped test reports as success. The end-to-end container test is the only executed proof
      # that image pull, hardened container creation, secret file delivery, the agent's
      # AGENTHOST_RUN_TOKEN callback, exit handling and cleanup work at all, so CI asserts that it
      # really ran rather than trusting the green tick.
      - name: Assert the container end-to-end test executed (did not skip)
        working-directory: backend
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          paths = glob.glob("tests/**/TestResults/*.trx", recursive=True)
          if not paths:
              sys.exit("no .trx test results were produced")

          executed, not_executed = 0, []
          for path in paths:
              for result in ET.parse(path).getroot().findall(".//t:UnitTestResult", ns):
                  name = result.get("testName") or ""
                  if "ContainerLifecycleTests" not in name:
                      continue
                  if result.get("outcome") == "Passed":
                      executed += 1
                  else:
                      not_executed.append(f'  {name}: {result.get("outcome")}')

          if not executed and not not_executed:
              sys.exit("ContainerLifecycleTests did not appear in the test results at all")
          if not_executed:
              sys.exit("the container end-to-end test did not execute against a real daemon:\n"
                       + "\n".join(not_executed))
          print(f"{executed} container end-to-end assertions ran against a real daemon")
          PY

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test -- --watch=false

  # The component specs above stub every service; this job is the only place the Angular app talks
  # to the real API over a real network, against a real Postgres. It is the frontend counterpart of
  # the backend's ContainerLifecycleTests: separate job because it needs .NET and a database that
  # the pure-frontend job has no business carrying.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenthost
          POSTGRES_PASSWORD: agenthost_dev
          POSTGRES_DB: agenthost_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_CONNECTION_STRING: "Host=localhost;Port=5432;Database=agenthost_e2e;Username=agenthost;Password=agenthost_dev"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Playwright's webServer would otherwise pay for the first build inside its own start-up
      # timeout, and a slow restore would look like a server that failed to come up.
      - name: Pre-build the API
        working-directory: backend
        run: dotnet build src/AgentHost.Api --configuration Debug

      - name: Run the end-to-end suite
        working-directory: frontend
        run: npm run e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
