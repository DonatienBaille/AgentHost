services:
  postgres:
    image: postgres:16-alpine
    container_name: agenthost-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agenthost
      POSTGRES_PASSWORD: agenthost_dev
      POSTGRES_DB: agenthost
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agenthost-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Filtering Docker API proxy. The backend used to receive /var/run/docker.sock bind-mounted
  # read-write, which is equivalent to handing it root on the host: anyone who can reach that
  # socket can start a privileged container that mounts /. This proxy sits in front of the socket
  # and only forwards the endpoint groups the orchestrator actually uses (images + containers),
  # rejecting everything else — exec, volumes, networks, swarm, plugins, the info/system APIs.
  #
  # This is a mitigation, not elimination: "create and start containers" is still enough to escape
  # to the host (nothing stops a request that asks for a privileged container or a host bind
  # mount). See the security section of README.md.
  #
  # The env var names below are those of tecnativa/docker-socket-proxy 0.3.x; verify them against
  # the tag you pin if you change it. Everything not listed defaults to 0 (denied).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: agenthost-docker-proxy
    environment:
      # Endpoint groups the orchestrator calls.
      CONTAINERS: 1        # create/inspect/logs/wait/remove
      IMAGES: 1            # pull (POST /images/create)
      # Mutating verbs. Without POST the proxy is read-only and no agent can be launched.
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 0
      # Everything else stays denied.
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      # Read-only: the proxy needs to talk to the socket, not to be able to replace it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    # Not published on the host — only reachable from the compose network.
    expose:
      - "2375"

  # Tier d'exécution (lot 1.1). Un processus par nœud en production (DaemonSet) ; ici, un service.
  #
  # POURQUOI IL EXISTE EN COMPOSE ALORS QUE LE DÉFAUT RESTE « inprocess ». Le mode remote est
  # justement celui qu'on ne peut pas valider en le lisant : il faut voir un run partir, être
  # arrêté et relire ses journaux à travers deux processus. Le service est donc toujours démarré,
  # et c'est le backend qui choisit de s'en servir ou non :
  #
  #   docker compose up                                  -> backend en mode inprocess (défaut)
  #   AGENTHOST_RUNNER_MODE=remote docker compose up      -> backend passant par le runner
  #
  # Le chemin inprocess reste donc pleinement fonctionnel pour le développement, ce qui est la
  # condition pour que le défaut reste crédible.
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: agenthost-runner
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      # Jeton partagé avec le backend. Valeur de développement : sans jeton, le runner refuse de
      # démarrer (voir RunnerAuthentication) — un runner ouvert est un accès root au nœud.
      Runner__AuthToken: ${AGENTHOST_RUNNER_TOKEN:-dev-runner-token-please-change-me}
      # Par le proxy filtrant, jamais le socket brut — même raisonnement que pour le backend.
      Docker__Host: tcp://docker-socket-proxy:2375
      Docker__WorkspacePath: /var/agenthost/runs
      # Le démon résout les sources de montage sur l'hôte ; ce conteneur voit le même arbre sous
      # /var/agenthost/runs. Même variable que côté backend, pour que les deux modes écrivent au
      # même endroit et qu'un run lancé dans un mode reste lisible dans l'autre.
      Docker__HostWorkspacePath: ${AGENTHOST_HOST_RUNS_PATH:-${PWD}/runs}
    volumes:
      # Doit être inscriptible par l'uid 64198 (voir la note du service backend).
      - ./runs:/var/agenthost/runs
    depends_on:
      docker-socket-proxy:
        condition: service_started
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agenthost-backend
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=agenthost;Username=agenthost;Password=agenthost_dev"
      Redis__Host: redis
      Redis__Port: "6379"
      # Orchestration. « inprocess » par défaut : le backend parle lui-même au démon, exactement
      # comme avant le lot 1.1. AGENTHOST_RUNNER_MODE=remote bascule sur le service runner
      # ci-dessus ; BaseUrl et AuthToken sont déjà là, ils ne servent qu'en mode remote.
      Runner__Mode: ${AGENTHOST_RUNNER_MODE:-inprocess}
      Runner__BaseUrl: http://runner:5001
      Runner__AuthToken: ${AGENTHOST_RUNNER_TOKEN:-dev-runner-token-please-change-me}
      # Through the filtering proxy, never the raw socket (see docker-socket-proxy above).
      Docker__Host: tcp://docker-socket-proxy:2375
      # Where THIS container reads/writes run data...
      Docker__WorkspacePath: /var/agenthost/runs
      # ...and where the DAEMON sees the same directory. These differ, and that difference is
      # exactly what used to make the compose stack unable to launch a single agent: bind sources
      # are resolved by the daemon (on the host), so sending /var/agenthost/runs made it mount a
      # freshly created empty directory — empty /workspace, empty /run/secrets, no error anywhere.
      # ${PWD} is the directory `docker compose` was invoked from, i.e. the host path of ./runs
      # below. Override with AGENTHOST_HOST_RUNS_PATH when the daemon is remote or the repo is
      # reached through a different mount point on the daemon's host.
      Docker__HostWorkspacePath: ${AGENTHOST_HOST_RUNS_PATH:-${PWD}/runs}
      # Agents with permissions.network=allowlist need an egress proxy; unset here, so such runs
      # get no network at all rather than unfiltered egress. Point this at your proxy to enable
      # them, e.g. http://egress-proxy:3128.
      # Docker__EgressProxy: http://egress-proxy:3128
      Artifacts__StoragePath: /var/agenthost/artifacts
      Cors__AllowedOrigins__0: http://localhost:4200
      # Trust X-Forwarded-For from the frontend nginx (any address on the compose bridge network),
      # so the API rate-limits by real client IP instead of lumping every anonymous caller into the
      # proxy's single bucket. Only this private range is trusted — see Program.cs.
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      # Dev-only AES-256 key (32 bytes, base64) so encrypted secrets survive container
      # restarts. Generate your own for any non-throwaway environment.
      Secrets__EncryptionKey: "5ijlcr2IxwxqH7PEwsUIGQSvbZ/w6EMuOk3mXorL54c="
      # Dev-only JWT signing secret. Generate your own for any non-throwaway environment.
      Jwt__Secret: "hkA6jtNJGUsnP4++43POCQPqDtH2ABIaIUKj9gXxeJmXnpv5kYxiR9tRYT+JUzke"
      Jwt__Issuer: agenthost
      Jwt__Audience: agenthost
    volumes:
      # No docker.sock here any more — Docker access goes through docker-socket-proxy.
      # NOTE: these directories must be writable by uid 64198 (the image's `agenthost` user):
      #   mkdir -p runs artifacts && sudo chown -R 64198:64198 runs artifacts
      - ./runs:/var/agenthost/runs
      - ./artifacts:/var/agenthost/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      runner:
        condition: service_started
    healthcheck:
      # Liveness only: readiness (/health/ready) also checks Postgres, and compose must not keep
      # restarting the API because the database is briefly unavailable.
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agenthost-frontend
    ports:
      # The image serves on 8080 because nginx runs unprivileged (see Dockerfile.frontend).
      - "4200:8080"
    environment:
      API_URL: http://localhost:5000
      SIGNALR_URL: http://localhost:5000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
    name: agenthost
    driver: bridge
